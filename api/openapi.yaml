components:
    schemas:
        ActionResponse:
            properties:
                code:
                    enum:
                        - 0
                    type: integer
                data:
                    $ref: '#/components/schemas/EmptyResult'
                message:
                    type: string
            required:
                - code
                - message
                - data
            type: object
        Approval:
            properties:
                visit_proof_url:
                    description: 'Allowed suffixes: .jpg, .jpeg, .png. HTTPS only. Path suffix only; remote content is not checked.'
                    format: uri
                    type: string
            required:
                - visit_proof_url
            type: object
        CreateLoan:
            properties:
                agreement_url:
                    description: 'Allowed suffix: .pdf. HTTPS only. Path suffix only; remote content is not checked.'
                    format: uri
                    type: string
                borrower_id:
                    maxLength: 128
                    minLength: 1
                    type: string
                principal_amount:
                    format: int64
                    minimum: 1
                    type: integer
                rate:
                    description: Decimal percent from 0 to 100.
                    oneOf:
                        - type: number
                        - type: string
                roi:
                    description: Decimal percent from 0 to rate.
                    oneOf:
                        - type: number
                        - type: string
            required:
                - borrower_id
                - principal_amount
                - rate
                - roi
                - agreement_url
            type: object
        CreateLoanResponse:
            properties:
                code:
                    enum:
                        - 0
                    type: integer
                data:
                    $ref: '#/components/schemas/CreateLoanResult'
                message:
                    type: string
            required:
                - code
                - message
                - data
            type: object
        CreateLoanResult:
            properties:
                loan_no:
                    type: string
            required:
                - loan_no
            type: object
        Disbursement:
            properties:
                signed_agreement_url:
                    description: 'Allowed suffixes: .pdf, .jpg, .jpeg. HTTPS only. Path suffix only; remote content is not checked.'
                    format: uri
                    type: string
            required:
                - signed_agreement_url
            type: object
        EmptyResult:
            maxProperties: 0
            type: object
        Error:
            properties:
                code:
                    type: integer
                message:
                    type: string
            required:
                - code
                - message
            type: object
        Health:
            properties:
                status:
                    type: string
            required:
                - status
            type: object
        Investment:
            properties:
                amount:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - amount
            type: object
        InvestmentResponse:
            properties:
                code:
                    enum:
                        - 0
                    type: integer
                data:
                    $ref: '#/components/schemas/InvestmentResult'
                message:
                    type: string
            required:
                - code
                - message
                - data
            type: object
        InvestmentResult:
            properties:
                id:
                    format: int64
                    type: integer
                invested_amount:
                    format: int64
                    type: integer
                loan_no:
                    type: string
                remaining_amount:
                    format: int64
                    type: integer
                status:
                    enum:
                        - PROPOSED
                        - APPROVED
                        - INVESTED
                        - DISBURSED
                    type: string
            required:
                - id
                - loan_no
                - invested_amount
                - remaining_amount
                - status
            type: object
        Loan:
            properties:
                agreement_url:
                    description: 'Allowed suffix: .pdf. HTTPS only. Path suffix only; remote content is not checked.'
                    format: uri
                    type: string
                borrower_id:
                    type: string
                created_at:
                    description: Server time in Unix milliseconds.
                    format: int64
                    type: integer
                invested_amount:
                    format: int64
                    type: integer
                loan_no:
                    type: string
                principal_amount:
                    format: int64
                    type: integer
                rate:
                    description: Decimal percent, for example "10".
                    type: string
                remaining_amount:
                    format: int64
                    type: integer
                roi:
                    description: Decimal percent, for example "8".
                    type: string
                status:
                    enum:
                        - PROPOSED
                        - APPROVED
                        - INVESTED
                        - DISBURSED
                    type: string
                updated_at:
                    description: Server time in Unix milliseconds.
                    format: int64
                    type: integer
            required:
                - loan_no
                - borrower_id
                - principal_amount
                - invested_amount
                - remaining_amount
                - rate
                - roi
                - agreement_url
                - status
                - created_at
                - updated_at
            type: object
        LoanResponse:
            properties:
                code:
                    enum:
                        - 0
                    type: integer
                data:
                    $ref: '#/components/schemas/Loan'
                message:
                    type: string
            required:
                - code
                - message
                - data
            type: object
    securitySchemes:
        bearerAuth:
            scheme: bearer
            type: http
info:
    description: Loan state and investment API. Amounts are integer minor units. Business timestamps are Unix milliseconds. Unknown JSON fields are ignored. No file downloads or real money transfers.
    title: Amartha Loan Service
    version: 1.0.0
openapi: 3.0.3
paths:
    /api/v1/loans:
        post:
            description: Create a PROPOSED loan. Staff identity comes from auth.
            operationId: CreateLoan
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateLoan'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateLoanResponse'
                    description: Success.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Invalid input or document URL.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Missing or invalid Bearer token.
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Role is not allowed.
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Internal server error.
            tags:
                - staff
    /api/v1/loans/{loan_no}:
        get:
            description: Read a loan and its current remaining amount. Staff only.
            operationId: GetLoan
            parameters:
                - description: Business loan number returned by create.
                  example: AbCdEfGhIjKlMnOpQrStUv
                  in: path
                  name: loan_no
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LoanResponse'
                    description: Success.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Missing or invalid Bearer token.
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Role is not allowed.
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Loan not found.
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Internal server error.
            tags:
                - staff
    /api/v1/loans/{loan_no}/approval:
        post:
            description: Approve a PROPOSED loan. Staff ID and approval time are set by the server. Returns an empty data object.
            operationId: ApproveLoan
            parameters:
                - description: Business loan number returned by create.
                  example: AbCdEfGhIjKlMnOpQrStUv
                  in: path
                  name: loan_no
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Approval'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ActionResponse'
                    description: Success.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Invalid input or document URL.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Missing or invalid Bearer token.
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Role is not allowed.
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: State, amount, or idempotency conflict.
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Internal server error.
            tags:
                - staff
    /api/v1/loans/{loan_no}/disbursement:
        post:
            description: Disburse an INVESTED loan. Staff ID and disbursement time are set by the server. Returns an empty data object.
            operationId: DisburseLoan
            parameters:
                - description: Business loan number returned by create.
                  example: AbCdEfGhIjKlMnOpQrStUv
                  in: path
                  name: loan_no
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Disbursement'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ActionResponse'
                    description: Success.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Invalid input or document URL.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Missing or invalid Bearer token.
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Role is not allowed.
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Loan not found.
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: State, amount, or idempotency conflict.
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Internal server error.
            tags:
                - staff
    /api/v1/loans/{loan_no}/investments:
        post:
            description: Invest in an APPROVED loan. Investor ID and email come from auth. Full funding sets INVESTED and queues email tasks. Exact retries return the original response with HTTP 200, even after the state changes. Changed data with the same key returns 409.
            operationId: Invest
            parameters:
                - description: Business loan number returned by create.
                  example: AbCdEfGhIjKlMnOpQrStUv
                  in: path
                  name: loan_no
                  required: true
                  schema:
                    type: string
                - description: Global key, 1 to 255 bytes. Use the same key only for the same loan, investor, email, and amount.
                  in: header
                  name: Idempotency-Key
                  required: true
                  schema:
                    maxLength: 255
                    minLength: 1
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Investment'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvestmentResponse'
                    description: Success.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Invalid input or document URL.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Missing or invalid Bearer token.
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Role is not allowed.
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Loan not found.
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: State, amount, or idempotency conflict.
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Internal server error.
            tags:
                - investor
    /healthz:
        get:
            operationId: healthz
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Health'
                    description: 'Status: ok'
            security: []
    /readyz:
        get:
            operationId: readyz
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Health'
                    description: 'Status: ready'
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Database unavailable.
            security: []
security:
    - bearerAuth: []
servers:
    - url: http://localhost:8080
