services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loans
      POSTGRES_USER: loans
      POSTGRES_PASSWORD: local-password
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - loan-data:/var/lib/postgresql/data
      - ./migrations/001_init.up.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/002_loan_rate_columns.up.sql:/docker-entrypoint-initdb.d/002_loan_rate_columns.sql:ro
      - ./migrations/003_decimal_rates.up.sql:/docker-entrypoint-initdb.d/003_decimal_rates.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loans -d loans"]
      interval: 2s
      timeout: 2s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  api:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DATABASE_URL: postgres://loans:local-password@db:5432/loans?sslmode=disable
      AUTH_TOKENS: '${AUTH_TOKENS:?Set AUTH_TOKENS using .env.example}'
      GIN_MODE: release
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    entrypoint: ["/worker"]
    environment:
      DATABASE_URL: postgres://loans:local-password@db:5432/loans?sslmode=disable
      SMTP_ADDR: mailpit:1025
      SMTP_FROM: loans@example.com
      SMTP_ALLOW_PLAINTEXT: "true"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
volumes:
  loan-data:
